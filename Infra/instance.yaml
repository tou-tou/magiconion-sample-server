resources:
  - name: instance-template
    type: compute.v1.instanceTemplate
    properties:
      properties:
        machineType: n1-standard-1
        minCpuPlatform: "Intel Skylake"
        serviceAccounts:
          - email: default
            scopes:
              - https://www.googleapis.com/auth/cloud-platform
        selfLink: https://compute.googleapis.com/compute/v1/projects/magiconion-sample/global/instanceTemplates/instance-template
        scheduling:
          preemptible: true
        disks:
          - deviceName: boot
            boot: true
            autoDelete: true
            initializeParams:
              sourceImage: projects/cos-cloud/global/images/family/cos-stable
        networkInterfaces:
          - network: $(ref.onion-network.selfLink)
            subnetwork: $(ref.onion-subnet.selfLink)
            accessConfigs:
              - name: External NAT
                type: ONE_TO_ONE_NAT
        metadata:
          items:
            - key: gce-container-declaration
              value: |
                spec:
                  containers:
                    - name: 'onion-server-container'
                      image: 'asia-northeast1-docker.pkg.dev/magiconion-sample/onion-server/onion-server:latest'
                      stdin: false
                      tty: false
                  restartPolicy: Always
          dependsOn:
            - onion-network
            - onion-subnet

  - name: instance-group-1-manager
    type: compute.v1.instanceGroupManager
    properties:
      zone: asia-northeast1-a
      instanceTemplate: projects/magiconion-sample/global/instanceTemplates/instance-template
      targetSize: 1
      metadata:
        dependsOn:
          - instance-template

  - name: instance-group-1-autoscaler
    type: compute.v1.autoscaler
    properties:
      zone: asia-northeast1-a
      target: $(ref.instance-group-1-manager.selfLink)
      autoscalingPolicy:
        maxNumReplicas: 1
        minNumReplicas: 0
      metadata:
        dependsOn:
          - instance-group-1-manager